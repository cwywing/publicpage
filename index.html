<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>行程公开页</title>
<style>
:root { --ink:#1a1814; --muted:#6b6358; --paper:#f3efe6; --card:#fffaf2; --pine:#2c4a42; --line:#e4d9c8; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:40px 20px 80px; }
h1 { font-size:28px; margin:0 0 8px; }
.note { color:var(--muted); font-size:14px; margin:0 0 28px; }
a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:0 0 12px; text-decoration:none; color:var(--ink); }
a.card b { display:block; font-size:18px; margin-bottom:4px; color:var(--pine); }
a.card span { color:var(--muted); font-size:14px; }
.old { font-size:14px; color:var(--muted); margin-top:28px; }
.old a { color:var(--pine); }
</style>
</head>
<body>
<div class="wrap">
  <h1>行程公开页</h1>
  <p class="note">所有行程放这一个仓库。点开就能看。</p>
  <a class="card" href="guizhou-5d/">
    <b>贵州 5 天</b>
    <span>贵阳住满 · 黄果树 · 青岩 · 亲子+外婆</span>
  </a>
  <a class="card" href="jiangxi-2026/">
    <b>浮梁茶山 × 篁岭 × 三清山｜2026 国庆 7 天</b>
  </a>
  <a class="card" href="yunnan-meili-2026/">
    <b>香格里拉 × 梅里｜7 天钟点表</b>
  </a>
</div>
</body>
</html>
